<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: Inhalt darf bis an die Ränder, wir polstern per safe-area-inset -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kochbuch</title>
  <meta name="description" content="Rezepte, Kochplaner und Einkaufsliste – komplett offline.">
  <meta name="color-scheme" content="light dark">
  <!-- Statusleiste übernimmt die Hintergrundfarbe der App (hell/dunkel) -->
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

  <!-- iOS: als Vollbild-App ohne Browserleiste starten -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kochbuch">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Jede Ansicht wird von app.js hier hineingerendert -->
  <main id="view"></main>

  <!-- Schwebende Tab-Leiste im "Liquid Glass"-Stil -->
  <nav id="tabbar" class="tabbar" aria-label="Hauptnavigation">
    <a href="#/" data-tab="rezepte">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 5.8c0-.9.7-1.6 1.6-1.4 2.6.4 4.9 1.3 6.9 2.9v13.2c-2-1.6-4.3-2.5-6.9-2.9-.9-.1-1.6-.8-1.6-1.7z"/><path d="M20.5 5.8c0-.9-.7-1.6-1.6-1.4-2.6.4-4.9 1.3-6.9 2.9v13.2c2-1.6 4.3-2.5 6.9-2.9.9-.1 1.6-.8 1.6-1.7z"/></svg>
      <span>Rezepte</span>
    </a>
    <a href="#/planer" data-tab="planer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span>Planer</span>
    </a>
    <a href="#/einkauf" data-tab="einkauf">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1.3 10.4a2 2 0 0 1-2 1.6H8.3a2 2 0 0 1-2-1.6z"/><path d="M9 10V7a3 3 0 0 1 6 0v3"/></svg>
      <span>Einkauf</span>
    </a>
    <a href="#/mehr" data-tab="mehr">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="8" cy="12" r=".6" fill="currentColor"/><circle cx="12" cy="12" r=".6" fill="currentColor"/><circle cx="16" cy="12" r=".6" fill="currentColor"/></svg>
      <span>Mehr</span>
    </a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
